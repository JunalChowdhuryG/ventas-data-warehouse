server:
  port: 8082

spring:
  application:
    name: oltp-generator
  datasource:
    url: ${OLTP_URL:jdbc:postgresql://localhost:5432/oltp}
    username: ${OLTP_OWNER_USER:oltp}
    password: ${OLTP_OWNER_PASSWORD:oltp}
  flyway:
    locations: classpath:db/migration/oltp

# Generador de datos (se puede sobrescribir con variables de entorno, p. ej. GENERADOR_ANOS_HISTORICO=1)
generador:
  semilla: 42
  anos-historico: 2
  pedidos-por-dia: 150
  clientes: 2000
  tasa-errores: 0.01          # fracción de líneas con un error inyectado a propósito
  proporcion-online: 0.30     # fracción de pedidos que salen en el CSV del canal online
  carga-inicial: true         # al arrancar con el OLTP vacío, carga el histórico
  flujo-diario-activo: true
  cron: "0 0 1 * * *"         # hora de Lima
  directorio-csv: ${GENERADOR_DIRECTORIO_CSV:./data/csv}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
