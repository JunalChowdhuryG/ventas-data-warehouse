name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compila y ejecuta pruebas unitarias y de integración (Testcontainers usa el Docker del runner)
      - name: Build y pruebas
        run: mvn -B verify

      - name: Validar docker-compose
        run: docker compose --env-file .env.example --profile apps config -q

  docker-images:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes de los servicios
        run: docker compose --env-file .env.example --profile apps build
