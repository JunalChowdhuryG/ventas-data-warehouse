global:
  scrape_interval: 15s

scrape_configs:
  # Servicios corriendo como contenedores (docker compose --profile apps up)
  - job_name: etl-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["etl-service:8081"]

  - job_name: olap-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["olap-api:8080"]

  - job_name: oltp-generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["oltp-generator:8082"]

  # Si ejecutas los servicios desde el IDE o con mvn spring-boot:run, comenta los jobs de arriba
  # y descomenta este (el compose define host.docker.internal para el contenedor de Prometheus):
  # - job_name: apps-en-host
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8081", "host.docker.internal:8080", "host.docker.internal:8082"]
